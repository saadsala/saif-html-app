<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نظام إدارة الدرجات الاحترافي 2026</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Reem+Kufi:wght@400;700&family=Changa:wght@400;600&display=swap" rel="stylesheet">
    
    <style>
        :root { --primary: #1e3a8a; --accent: #3b82f6; --success: #10b981; --danger: #ef4444; --bg: #f8fafc; --text: #1e293b; }
        body { font-family: 'Changa', sans-serif; background-color: var(--bg); color: var(--text); margin: 0; padding-bottom: 50px; }
        
        .main-header { text-align: center; padding: 20px; background: linear-gradient(135deg, #1e3a8a 0%, #3b82f6 100%); color: white; box-shadow: 0 4px 10px rgba(0,0,0,0.2); }
        .main-header h1 { font-family: 'Reem Kufi', sans-serif; margin: 0; font-size: 1.8rem; }

        #auth-modal {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85); z-index: 2000; justify-content: center; align-items: center;
        }
        .auth-box { background: white; padding: 2rem; border-radius: 20px; width: 90%; max-width: 400px; text-align: center; }

        .container { padding: 20px; max-width: 1400px; margin: auto; }
        .card { background: white; padding: 20px; border-radius: 15px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); margin-bottom: 20px; }
        
        input, select { padding: 10px; border: 2px solid #e2e8f0; border-radius: 10px; font-family: inherit; font-size: 14px; width: 100%; box-sizing: border-box; }
        input:focus { border-color: var(--accent); outline: none; }

        .grid-inputs { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 12px; margin-bottom: 15px; }
        
        .btn { padding: 10px 20px; border: none; border-radius: 10px; cursor: pointer; font-weight: 600; transition: 0.2s; font-family: inherit; display: inline-flex; align-items: center; justify-content: center; gap: 8px; font-size: 14px; }
        .btn-primary { background: var(--accent); color: white; }
        .btn-success { background: var(--success); color: white; }
        .btn-danger { background: var(--danger); color: white; }
        .btn-warning { background: #f59e0b; color: white; }
        .btn-info { background: #6366f1; color: white; }

        .tabs { display: flex; gap: 10px; margin-bottom: 20px; }
        .tab-link { padding: 12px; background: white; border: 1px solid #e2e8f0; border-radius: 10px; cursor: pointer; flex: 1; text-align: center; font-weight: bold; }
        .tab-link.active { background: var(--primary); color: white; border-color: var(--primary); }

        .table-wrapper { background: white; border-radius: 15px; overflow-x: auto; padding: 10px; }
        table { width: 100%; border-collapse: collapse; min-width: 1100px; }
        th { background: #f1f5f9; color: var(--primary); padding: 12px 8px; border: 1px solid #cbd5e1; font-size: 13px; }
        td { padding: 10px 5px; border: 1px solid #e2e8f0; text-align: center; font-size: 13px; }
        
        .group-header { background: #eff6ff; font-weight: bold; text-align: right; color: var(--primary); padding: 12px; border-right: 5px solid var(--primary); }
        .search-bar { max-width: 500px; margin: 0 auto 20px; position: relative; }

        #print-zone { position: absolute; left: -9999px; width: 1200px; }
        .print-page { padding: 40px; background: white; color: black; }
        .print-head { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #333; padding-bottom: 10px; margin-bottom: 20px; }
        .print-table { width: 100%; border-collapse: collapse; }
        .print-table th, .print-table td { border: 1px solid #000; padding: 6px; font-size: 13px; }
    </style>
</head>
<body>

<header class="main-header">
    <h1>نظام الإدارة المدرسية الرقمي</h1>
</header>

<div id="auth-modal">
    <div class="auth-box">
        <h3>🔐 تسجيل الدخول</h3>
        <input type="text" id="loginUser" placeholder="اسم المستخدم">
        <input type="password" id="loginPass" placeholder="كلمة المرور">
        <button class="btn btn-primary" style="width:100%; margin-top:15px" onclick="checkAuth()">دخول</button>
        <button class="btn" style="width:100%; margin-top:10px; background:#f1f5f9" onclick="closeAuth()">عرض السجل فقط</button>
    </div>
</div>

<div class="container">
    <div id="admin-bar" style="display:none; justify-content: space-between; align-items: center; margin-bottom: 15px;">
        <span>أهلاً بك: <b id="user-display"></b></span>
        <div style="display:flex; gap:10px;">
            <button class="btn btn-info" style="font-size:12px" onclick="exportBackup()">📥 نسخة احتياطية (JSON)</button>
            <button class="btn btn-info" style="font-size:12px" onclick="document.getElementById('importFile').click()">📤 استيراد نسخة</button>
            <input type="file" id="importFile" hidden onchange="importBackup(event)">
            <button class="btn btn-danger" style="font-size:12px" onclick="logout()">خروج</button>
        </div>
    </div>

    <div class="tabs">
        <div class="tab-link active" id="tab-out" onclick="switchTab('out')">📊 عرض وتصدير</div>
        <div class="tab-link" id="tab-in" onclick="switchTab('in')">⚙️ إدخال البيانات</div>
    </div>

    <!-- واجهة الإدخال -->
    <div id="view-in" style="display:none">
        <div class="card">
            <h3 style="margin-top:0">بيانات السجل الرسمية (للطباعة)</h3>
            <div class="grid-inputs">
                <input type="text" id="subject" placeholder="المادة (مثلاً: حاسوب)">
                <input type="text" id="year" placeholder="العام الدراسي (2025-2026)">
                <input type="text" id="teacher" placeholder="اسم المدرس">
            </div>
            <hr>
            <h3>إضافة / تعديل درجات طالب</h3>
            <div class="grid-inputs">
                <input type="text" id="std-name" placeholder="الاسم الرباعي للطالب">
                <select id="std-level"><option>الأول</option><option>الثاني</option><option>الثالث</option></select>
                <select id="std-sec"><option>أ</option><option>ب</option><option>ج</option><option>د</option></select>
                <input type="number" id="m1" placeholder="ش1">
                <input type="number" id="m2" placeholder="ش2">
                <input type="number" id="mid" placeholder="نصف السنة">
                <input type="number" id="m3" placeholder="ش3">
                <input type="number" id="m4" placeholder="ش4">
            </div>
            <div style="text-align:center; gap:10px; display:flex; flex-wrap:wrap; justify-content:center">
                <button id="save-btn" class="btn btn-primary" onclick="saveStudent()">حفظ الطالب</button>
                
                <!-- زر استيراد من اكسل الجديد -->
                <button class="btn btn-success" onclick="document.getElementById('excel-input').click()">📥 استيراد من Excel</button>
                <input type="file" id="excel-input" hidden accept=".xlsx, .xls" onchange="importFromExcel(event)">
                
                <button id="cancel-btn" class="btn" style="display:none; background:#ccc" onclick="resetForm()">إلغاء</button>
                <button class="btn btn-danger" onclick="clearAll()">مسح السجل بالكامل</button>
            </div>
            <p style="text-align: center; font-size: 12px; color: #666; margin-top: 10px;">* عند الاستيراد، تأكد أن ملف Excel يحتوي على رؤوس أعمدة واضحة (الاسم، ش1، ش2، ...)</p>
        </div>
    </div>

    <!-- واجهة العرض -->
    <div id="view-out">
        <div class="search-bar">
            <input type="text" id="search" placeholder="🔍 ابحث عن اسم طالب..." onkeyup="renderTable()">
        </div>
        <div style="text-align:center; margin-bottom:15px; display:flex; gap:10px; justify-content:center">
            <button class="btn btn-success" onclick="exportExcel()">تصدير Excel</button>
            <button class="btn" style="background:#7c3aed; color:white" onclick="printOfficialPDF()">🖨️ طباعة السجل الرسمي (PDF)</button>
        </div>
        <div class="table-wrapper">
            <table>
                <thead>
                    <tr>
                        <th>التحكم</th><th>الاسم</th><th>ش1</th><th>ش2</th><th>ف1</th><th>نصف السنة</th><th>ش3</th><th>ش4</th><th>ف2</th><th>النهائي</th>
                    </tr>
                </thead>
                <tbody id="table-body"></tbody>
            </table>
        </div>
    </div>
</div>

<div id="print-zone"></div>

<script>
    let students = JSON.parse(localStorage.getItem('sys_students')) || [];
    let meta = JSON.parse(localStorage.getItem('sys_meta')) || { subject: '', year: '', teacher: '' };
    let editIdx = -1;
    let isAdmin = false;

    document.getElementById('subject').value = meta.subject;
    document.getElementById('year').value = meta.year;
    document.getElementById('teacher').value = meta.teacher;

    function checkAuth() {
        const u = document.getElementById('loginUser').value;
        const p = document.getElementById('loginPass').value;
        if(u === "سيف" && p === "1995") {
            isAdmin = true;
            document.getElementById('auth-modal').style.display = 'none';
            document.getElementById('admin-bar').style.display = 'flex';
            document.getElementById('user-display').innerText = u;
            switchTab('in');
        } else { alert("البيانات غير صحيحة"); }
    }

    function closeAuth() { document.getElementById('auth-modal').style.display = 'none'; switchTab('out'); }
    function logout() { isAdmin = false; document.getElementById('admin-bar').style.display = 'none'; switchTab('out'); }

    function switchTab(t) {
        if(t === 'in' && !isAdmin) { document.getElementById('auth-modal').style.display = 'flex'; return; }
        document.getElementById('view-in').style.display = t === 'in' ? 'block' : 'none';
        document.getElementById('view-out').style.display = t === 'out' ? 'block' : 'none';
        document.getElementById('tab-in').className = t === 'in' ? 'tab-link active' : 'tab-link';
        document.getElementById('tab-out').className = t === 'out' ? 'tab-link active' : 'tab-link';
        renderTable();
    }

    function saveStudent() {
        const s = {
            name: document.getElementById('std-name').value,
            level: document.getElementById('std-level').value,
            sec: document.getElementById('std-sec').value,
            m1: +document.getElementById('m1').value||0, m2: +document.getElementById('m2').value||0,
            mid: +document.getElementById('mid').value||0,
            m3: +document.getElementById('m3').value||0, m4: +document.getElementById('m4').value||0
        };
        if(!s.name) return alert("الاسم مطلوب");
        if(editIdx > -1) students[editIdx] = s;
        else students.push(s);
        
        updateMetaFromInputs();
        saveData();
        resetForm();
        renderTable();
        alert("تم الحفظ بنجاح");
    }

    function updateMetaFromInputs() {
        meta = {
            subject: document.getElementById('subject').value,
            year: document.getElementById('year').value,
            teacher: document.getElementById('teacher').value
        };
    }

    // --- دالة استيراد Excel الجديدة ---
    function importFromExcel(e) {
        const file = e.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = function(event) {
            const data = new Uint8Array(event.target.result);
            const workbook = XLSX.read(data, { type: 'array' });
            const firstSheet = workbook.Sheets[workbook.SheetNames[0]];
            const jsonData = XLSX.utils.sheet_to_json(firstSheet);

            if (jsonData.length === 0) {
                alert("الملف فارغ أو غير صالح");
                return;
            }

            // محاولة مطابقة الأعمدة بذكاء
            const newStudents = jsonData.map(row => {
                return {
                    name: row["الاسم"] || row["اسم الطالب"] || row["Name"] || "",
                    level: row["الصف"] || row["المرحلة"] || row["Level"] || "الأول",
                    sec: row["الشعبة"] || row["القسم"] || row["Section"] || "أ",
                    m1: +(row["ش1"] || row["الشهر الأول"] || row["M1"] || 0),
                    m2: +(row["ش2"] || row["الشهر الثاني"] || row["M2"] || 0),
                    mid: +(row["نصف السنة"] || row["Mid"] || 0),
                    m3: +(row["ش3"] || row["الشهر الثالث"] || row["M3"] || 0),
                    m4: +(row["ش4"] || row["الشهر الرابع"] || row["M4"] || 0)
                };
            }).filter(s => s.name !== "");

            if (newStudents.length > 0) {
                if (confirm(`تم العثور على ${newStudents.length} طالب. هل تريد إضافتهم للسجل الحالي؟`)) {
                    students = [...students, ...newStudents];
                    saveData();
                    renderTable();
                    alert("تم الاستيراد بنجاح");
                }
            } else {
                alert("لم يتم العثور على بيانات صالحة. تأكد من مسميات الأعمدة.");
            }
            e.target.value = ""; // تفريغ المدخل لاستخدامه مرة أخرى
        };
        reader.readAsArrayBuffer(file);
    }

    function renderTable() {
        const body = document.getElementById('table-body');
        body.innerHTML = "";
        const query = document.getElementById('search').value;
        let filtered = students.map((s, i) => ({...s, originalIdx: i}));
        if(query) filtered = filtered.filter(s => s.name.includes(query));

        ["أ", "ب", "ج", "د"].forEach(section => {
            const group = filtered.filter(s => s.sec === section);
            if(group.length > 0) {
                body.innerHTML += `<tr><td colspan="10" class="group-header">الشعبة: ${section}</td></tr>`;
                group.forEach(s => {
                    const f1 = (s.m1+s.m2)/2;
                    const f2 = (s.m3+s.m4)/2;
                    const total = (f1+f2+s.mid)/3;
                    body.innerHTML += `<tr>
                        <td>
                            <button onclick="startEdit(${s.originalIdx})" style="cursor:pointer">📝</button>
                            <button onclick="deleteStd(${s.originalIdx})" style="cursor:pointer; color:red">🗑️</button>
                        </td>
                        <td style="text-align:right"><b>${s.name}</b></td>
                        <td>${s.m1}</td><td>${s.m2}</td><td style="background:#f8fafc">${f1.toFixed(1)}</td>
                        <td><b>${s.mid}</b></td>
                        <td>${s.m3}</td><td>${s.m4}</td><td style="background:#f8fafc">${f2.toFixed(1)}</td>
                        <td style="background:#eff6ff; font-weight:bold">${total.toFixed(1)}</td>
                    </tr>`;
                });
            }
        });
    }

    function startEdit(idx) {
        editIdx = idx;
        const s = students[idx];
        document.getElementById('std-name').value = s.name;
        document.getElementById('std-level').value = s.level;
        document.getElementById('std-sec').value = s.sec;
        document.getElementById('m1').value = s.m1; document.getElementById('m2').value = s.m2;
        document.getElementById('mid').value = s.mid;
        document.getElementById('m3').value = s.m3; document.getElementById('m4').value = s.m4;
        document.getElementById('save-btn').innerText = "تعديل البيانات";
        document.getElementById('save-btn').className = "btn btn-warning";
        document.getElementById('cancel-btn').style.display = "inline-flex";
        switchTab('in');
    }

    function resetForm() {
        editIdx = -1;
        document.querySelectorAll('#view-in input').forEach(i => { if(i.id.startsWith('std') || i.type === 'number') i.value = ''; });
        document.getElementById('save-btn').innerText = "حفظ الطالب";
        document.getElementById('save-btn').className = "btn btn-primary";
        document.getElementById('cancel-btn').style.display = "none";
    }

    function deleteStd(idx) { if(confirm("حذف الطالب؟")) { students.splice(idx,1); saveData(); renderTable(); } }
    function clearAll() { if(confirm("سيتم مسح السجل بالكامل! هل أنت متأكد؟")) { students = []; saveData(); renderTable(); } }
    
    function saveData() { 
        localStorage.setItem('sys_students', JSON.stringify(students)); 
        localStorage.setItem('sys_meta', JSON.stringify(meta));
    }

    function exportBackup() {
        const data = { students, meta, date: new Date().toISOString() };
        const blob = new Blob([JSON.stringify(data)], {type: 'application/json'});
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = `نسخة_احتياطية_${new Date().toLocaleDateString()}.json`;
        a.click();
    }

    function importBackup(e) {
        const reader = new FileReader();
        reader.onload = (ev) => {
            const data = JSON.parse(ev.target.result);
            if(data.students) {
                students = data.students;
                meta = data.meta || meta;
                saveData();
                location.reload();
            }
        };
        reader.readAsText(e.target.files[0]);
    }

    async function printOfficialPDF() {
        const zone = document.getElementById('print-zone');
        zone.innerHTML = "";
        const pdf = new jspdf.jsPDF('l', 'mm', 'a4');
        const sections = ["أ", "ب", "ج", "د"];
        let isFirst = true;

        for (let sec of sections) {
            const group = students.filter(s => s.sec === sec);
            if(group.length === 0) continue;

            const page = document.createElement('div');
            page.className = 'print-page';
            page.innerHTML = `
                <div class="print-head">
                    <div><p>وزارة التربية العراقية</p><p>التعليم المهني</p></div>
                    <div style="text-align:center">
                        <h2 style="margin:0">سجل درجات الطلاب الرسمي</h2>
                        <p>المادة: ${meta.subject || '-------'} | الشعبة: (${sec})</p>
                    </div>
                    <div style="text-align:left">
                        <p>العام الدراسي: ${meta.year || '2025-2026'}</p>
                        <p>المدرس: ${meta.teacher || '-------'}</p>
                    </div>
                </div>
                <table class="print-table">
                    <thead>
                        <tr style="background:#f0f0f0">
                            <th>ت</th><th>اسم الطالب الرباعي</th><th>الصف</th><th>ش1</th><th>ش2</th><th>م1</th><th>نصف السنة</th><th>ش3</th><th>ش4</th><th>م2</th><th>النهائي</th>
                        </tr>
                    </thead>
                    <tbody>
                        ${group.map((s, i) => `
                            <tr>
                                <td>${i+1}</td><td style="text-align:right; font-weight:bold">${s.name}</td>
                                <td>${s.level}</td><td>${s.m1}</td><td>${s.m2}</td>
                                <td>${((s.m1+s.m2)/2).toFixed(1)}</td><td>${s.mid}</td>
                                <td>${s.m3}</td><td>${s.m4}</td>
                                <td>${((s.m3+s.m4)/2).toFixed(1)}</td>
                                <td style="background:#eee; font-weight:bold">${(((s.m1+s.m2)/2 + (s.m3+s.m4)/2 + s.mid)/3).toFixed(1)}</td>
                            </tr>
                        `).join('')}
                    </tbody>
                </table>
                <div style="margin-top:30px; display:flex; justify-content:space-between">
                    <p>توقيع المدرس: ..........................</p>
                    <p>توقيع مدير المدرسة: ..........................</p>
                </div>
            `;
            zone.appendChild(page);
            const canvas = await html2canvas(page, { scale: 2 });
            if(!isFirst) pdf.addPage();
            pdf.addImage(canvas.toDataURL('image/png'), 'PNG', 5, 5, 287, (canvas.height*287)/canvas.width);
            isFirst = false;
            zone.innerHTML = "";
        }
        window.open(pdf.output('bloburl'), '_blank');
    }

    function exportExcel() {
        const ws = XLSX.utils.json_to_sheet(students);
        const wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, ws, "الدرجات");
        XLSX.writeFile(wb, "سجل_الدرجات.xlsx");
    }

    renderTable();
</script>
</body>
</html>
